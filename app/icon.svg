<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CarAI">
  <title>CarAI</title>
  <!--
    L'icône de CarAI : une prise de recharge.

    POURQUOI CE MOTIF. CarAI suit un véhicule ÉLECTRIQUE (Toyota bZ, powertrainType BEV) et
    ce qu'on y regarde en premier est la charge. Une silhouette de voiture dirait « auto »
    sans rien dire de plus ; l'éclair dans un cercle dit « électrique », c'est-à-dire ce qui
    distingue cette app.

    POURQUOI CE DESSIN. Deux formes, pas une de plus. À 16 px — la taille réelle d'un onglet
    de navigateur — un dessin détaillé devient une tache. Un disque et un éclair restent
    lisibles.

    POURQUOI UN FOND OPAQUE. Un favicon ne connaît pas le thème de qui le regarde. Le fond
    sombre garantit le contraste du rose aussi bien sur une barre d'onglets claire que
    sombre ; une icône transparente disparaîtrait sur l'une des deux.

    Le rose est #db2777 : la même que `app.color` publiée au hub (lib/hubSummary.ts), où
    elle identifie CarAI parmi les autres widgets. La changer ici sans la changer là
    désaccorderait les deux.
  -->
  <rect width="32" height="32" rx="7" fill="#160d13"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#db2777" stroke-width="2.4"/>
  <path d="M17.4 9.6 L11.6 17.2 H15.4 L14.6 22.4 L20.4 14.8 H16.6 Z"
        fill="#db2777" stroke="#db2777" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
