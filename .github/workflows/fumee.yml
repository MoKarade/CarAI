name: Fumée de production

# Après chaque déploiement de production réussi, sonde l'app EN LIGNE : une CI verte ne prouve pas que
# le site répond. Le contrôle est le workflow commun de MoKarade/.github (plan de standardisation du
# 15/10/2026, décision 5) ; ce fichier ne fait que l'appeler.
#
# Contrôles (rouge si l'un échoue après 3 essais) : santé (/api/sante), summary refusé sans jeton puis
# valide avec le jeton (/hub/summary), page de connexion (/login). Le journal ne contient ni corps de
# réponse ni jeton.
# Le workflow commun reçoit le jeton sous le nom `hub-token` (un nom de secret GitHub ne peut pas porter de
# tiret, donc `secrets: inherit` ne le remplit jamais) : on le passe explicitement depuis HUB_TOKEN, et
# HUB_DISPATCH_TOKEN (retour en arrière si la fumée est rouge) de la même façon (CarAI#136).
on:
  deployment_status:

permissions:
  contents: read

jobs:
  fumee:
    name: Fumée de production
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production'
    uses: MoKarade/.github/.github/workflows/fumee.yml@main
    with:
      url-base: https://carai.hubperso.com
    secrets:
      hub-token: ${{ secrets.HUB_TOKEN }}
      HUB_DISPATCH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
