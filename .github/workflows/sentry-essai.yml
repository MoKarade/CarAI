name: Essai Sentry

# Lancement MANUEL seulement : envoie une erreur volontaire à Sentry avec le secret SENTRY_DSN du
# dépôt et échoue si Sentry ne répond pas par un code 2xx. C'est la preuve que la chaîne
# secret → réglages de l'app (lib/sentryConfig.ts) → Sentry fonctionne. Aucun déclencheur
# automatique : rien n'est envoyé à Sentry sans geste.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essai:
    # Plafond : un job figé tourne six heures avant d'échouer. L'essai dure quelques secondes.
    timeout-minutes: 5
    name: Envoyer une erreur d'essai
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dépendances
        run: npm ci --ignore-scripts

      - name: Envoyer l'erreur d'essai
        run: npm run sentry:essai
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
